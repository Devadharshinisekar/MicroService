syntax = "proto3";

option csharp_namespace = "EcomGRPC.Client";

import "google/protobuf/timestamp.proto";

service Product {
  rpc GetProductByProductId (GetProductByProductIdRequest) returns (GetProductByProductIdResponse);
  rpc GetAllProducts (GetAllProductsRequest) returns (GetAllProductsResponse);
  rpc AddProduct (AddProductRequest) returns (AddProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
}

message ProductDetails {
  int32 product_id = 1;
  string product_name = 2;
  string description = 3;
  int32 quantity = 4;
  double price = 5;
}

message GetAllProductsRequest {}

message GetAllProductsResponse {
  repeated ProductDetails product_details = 1;
}

message GetProductByProductIdRequest {
  int32 product_id = 1;
}

message GetProductByProductIdResponse {
  int32 product_id = 1;
  string product_name = 2;
  string description = 3;
  int32 quantity = 4;
  double price = 5;
}

message AddProductRequest {
  string product_name = 1;
  string description = 2;
  int32 quantity = 3;
  double price = 4;
}

message AddProductResponse {
  string message = 1;
}

message UpdateProductRequest {
  int32 product_id = 1;
  string product_name = 2;
  string description = 3;
  int32 quantity = 4;
  double price = 5;
}

message UpdateProductResponse {
  string message = 1;
}
